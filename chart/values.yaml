# Configuration for Uptime Kuma version sync CronJob

# Helm-specific overrides
nameOverride: 
fullnameOverride: 

# Docker image configuration
image:
  repository: ghcr.io/hjukic/kuma-versionizer
  tag: latest
  pullPolicy: Always
  imagePullSecrets: []

# CronJob schedule (cron format)
schedule: "*/10 * * * *"

# Uptime Kuma connection settings
uptimeKuma:
  url: "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001"
  usernameSecret:
    name: uptime-kuma-credentials
    key: username
  passwordSecret:
    name: uptime-kuma-credentials
    key: password

# SSL verification for version endpoints
verifySSL: false

# HTTP request behaviour for version endpoints
request:
  timeoutSeconds: 10
  retries: 3

# Service configurations (list of services to monitor)
# Each service needs a monitorName, versionEndpoint, and optional tagPrefix
services: []
  # Example:
  # - monitorName: "My Service"
  #   versionEndpoint: "https://myservice.example.com/version.txt"
  #   tagPrefix: "version"

# Additional environment variables
extraEnv: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Resource limits and requests
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

# Job timeout - maximum time the job is allowed to run (in seconds)
# Default: 600 seconds (10 min)
activeDeadlineSeconds: 600

# Pod termination grace period (in seconds)
# How long to wait for graceful shutdown before killing the pod
# Default: 30 seconds
terminationGracePeriodSeconds: 30

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
